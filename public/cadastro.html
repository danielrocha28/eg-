<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Egó | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="icon" href="../assets/imgs/logo-cima.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>

  <div class="login-buttons">
    <div class="voltar">
      <a href="index.html">
        <svg fill="currentColor" height="22" viewBox="0 0 22 22" width="22" xmlns="http://www.w3.org/2000/svg">
          <rect class="seta-traco" height="2" width="0" x="7" y="10"></rect>
          <path d="M15.75 4H13L6 11L13 18H15.75L8.75 11L15.75 4Z"></path>
        </svg>
        <span>VOLTAR</span>
      </a>
    </div>

    <div class="cadastro">
      <a href="login.html">
        <span class="cadastro-inner">
          <span class="cadastro-texto">FAZER LOGIN</span>
          <span class="cadastro-linha-wrapper">
            <div class="cadastro-linha"></div>
          </span>
        </span>
      </a>
    </div>
  </div>


  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Crie uma conta</h2>
        <div class="formulario">
          
          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
          </div>
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
          </div>
          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>
          <button class="botao" onclick="cadastrar()">CADASTRAR</button>
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>

</body>

</html>

<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    nomeVar = nomeVar.trim();
    emailVar = emailVar.trim();

    if (nomeVar == "" || emailVar == "" || senhaVar == "" || confirmacaoSenhaVar == "") {
      exibirErro("Todos os campos são obrigatórios!");
      return false;
    }

    if (emailVar.indexOf("@") == -1 || emailVar.indexOf(".com") == -1) {
      exibirErro("E-mail inválido! falta @ ou .com");
      return false;
    }

    if (senhaVar != confirmacaoSenhaVar) {
      exibirErro("As senhas não coincidem!");
      return false;
    }

    if (senhaVar.length < 6) {
      exibirErro("A senha não pode ser menor que 6 dígitos!");
      return false;
    }

    if (!/[a-z]/.test(senhaVar)) {
      exibirErro("A senha deve possuir pelo menos uma letra");
      return false;
    }

    if (!/[0-9]/.test(senhaVar)) {
      exibirErro("A senha deve possuir pelo menos um número!");
      return false;
    }

    if (!/[A-Z]/.test(senhaVar)) {
      exibirErro("A senha deve possuir pelo menos uma letra maiúscula!");
      return false;
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }


  // Listando empresas cadastradas 
  function exibirErro(mensagem) {
    cardErro.style.display = "block";
    mensagem_erro.innerHTML = mensagem;
    setTimeout(sumirMensagem, 3000); // Oculta automaticamente após 3 segundos
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
