<script>
    window.onload = function () {
        b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
        carregarGrafico();
    }

    // ── 1. ESTRUTURA HTML DOS GRÁFICOS ──
    function carregarGrafico() {
        document.getElementById("graficos").innerHTML = `
            <div style="display: flex; flex-direction: column; gap: 40px; align-items: center; width: 100%;">
                
                
                <div id="graficoPerfis" style="width:100%; max-width:700px; display:flex; flex-direction:column; align-items:center;">
                    <h3 style="color:#1a1a1a; margin-bottom:20px; font-family:'Exo 2',sans-serif; font-size:18px; font-weight:600;">
                        Distribuição Geral dos Perfis
                    </h3>
                    <div class="grafico-container" style="position: relative; height:400px; width:100%;">
                        <canvas id="myChartCanvas"></canvas>
                    </div>
                </div>

                
                <div id="graficoRespostas" style="width:100%; max-width:700px; display:flex; flex-direction:column; align-items:center;">
                    <h3 style="color:#1a1a1a; margin-bottom:20px; font-family:'Exo 2',sans-serif; font-size:18px; font-weight:600;">
                        Composição do Seu Perfil
                    </h3>
                    <div class="grafico-container" style="position: relative; height:350px; width:100%;">
                        <canvas id="donutChartCanvas"></canvas>
                    </div>
                </div>

            </div>
        `;
        
        obterDadosGrafico(); 
        obterDadosPerfilUsuario(); 
    }
    function obterDadosGrafico() {
        fetch("/dashboard/perfis", { cache: "no-store" })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {
                        plotarGrafico(resposta);
                    });
                } else {
                    console.error("Erro ao buscar dados do Radar");
                }
            })
            .catch(function (erro) {
                console.error(erro);
            });
    }

    function plotarGrafico(resposta) {
        let labels = [];
        let dados = {
            labels: labels,
            datasets: [{
                label: "Porcentagem de Usuários (%)",
                data: [],
                borderColor: '#e6005a',
                borderWidth: 3,
                backgroundColor: 'rgba(230, 0, 90, 0.15)',
                pointBackgroundColor: '#32b9cd',
                pointBorderColor: '#fff',
                pointHoverBackgroundColor: '#fff',
                pointHoverBorderColor: '#32b9cd'
            }]
        };

        let totalUsuarios = 0;
        for (let i = 0; i < resposta.length; i++) {
            totalUsuarios += Number(resposta[i].total);
        }

        for (let i = 0; i < resposta.length; i++) {
            let registro = resposta[i];
            labels.push(registro.nome);
            let porcentagem = (registro.total / totalUsuarios) * 100;
            dados.datasets[0].data.push(porcentagem.toFixed(1));
        }

        const config = {
            type: "radar",
            data: dados,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    r: {
                        min: 0,
                        suggestedMax: 50,
                        ticks: {
                            stepSize: 20,
                            callback: function (value) { return value + '%'; }
                        }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function (context) {
                                return context.raw + '% dos usuários';
                            }
                        }
                    }
                }
            }
        };

        new Chart(document.getElementById("myChartCanvas"), config);
    }

   
    function obterDadosPerfilUsuario() {
       
        let idUsuario = sessionStorage.ID_USUARIO;

        fetch(`/dashboard/respostas/${idUsuario}`, { cache: "no-store" })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {
                        plotarGraficoDonut(resposta);
                    });
                } else {
                    console.error("Erro ao buscar dados do perfil individual");
                }
            })
            .catch(function (erro) {
                console.error(erro);
            });
    }

    function plotarGraficoDonut(resposta) {
        let labelsDonut = [];
        let dadosDonut = {
            labels: labelsDonut,
            datasets: [{
                label: 'Composição do Perfil',
                data: [],
                backgroundColor: [
                    'rgba(230, 0, 90, 0.6)',   // Rosa
                    'rgba(50, 185, 205, 0.6)', // Azul claro
                    'rgba(255, 206, 86, 0.6)', // Amarelo
                    'rgba(75, 192, 192, 0.6)', // Verde
                    'rgba(153, 102, 255, 0.6)' // Roxo
                ],
                borderColor: [
                    '#e6005a',
                    '#32b9cd',
                    '#ffce56',
                    '#4bc0c0',
                    '#9966ff'
                ],
                borderWidth: 2
            }]
        };

        let totalRespostas = 0;
        
       
        for (let i = 0; i < resposta.length; i++) {
            totalRespostas += Number(resposta[i].total);
        }

        for (let i = 0; i < resposta.length; i++) {
            let registro = resposta[i];
            
          
            labelsDonut.push(registro.alternativa_escolhida); 
            
            let porcentagem = (Number(registro.total) / totalRespostas) * 100;
            dadosDonut.datasets[0].data.push(porcentagem.toFixed(1));
        }

        const configDonut = {
            type: 'doughnut',
            data: dadosDonut,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { 
                        position: 'bottom',
                        labels: { font: { family: "'Exo 2', sans-serif", size: 14 } }
                    },
                    tooltip: {
                        callbacks: {
                            label: function (context) {
                                return ` ${context.label}: ${context.raw}%`;
                            }
                        }
                    }
                }
            }
        };

        new Chart(document.getElementById("donutChartCanvas"), configDonut);
    }
</script>
