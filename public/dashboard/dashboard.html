<script>

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    window.onload = function() {
        b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
        carregarGrafico();
    }

    function obterDadosGrafico() {
        fetch("/dashboard/perfis", { cache: "no-store" })
            .then(function(response) {
                if (response.ok) {
                    response.json().then(function(resposta) {
                        console.log(resposta);
                        plotarGrafico(resposta);
                    });
                } else {
                    console.error("Erro ao buscar dados");
                }
            })
            .catch(function(erro) {
                console.error(erro);
            });
    }

    function plotarGrafico(resposta) {
        let labels = [];

        let dados = {
            labels: labels,
            datasets: [{
                label: "Porcentagem de Usuários (%)",
                data: [],
                borderColor: '#e6005a',
                borderWidth: 3,
                backgroundColor: 'rgba(230, 0, 90, 0.15)',
                pointBackgroundColor: '#32b9cd',
                pointBorderColor: '#fff',
                pointHoverBackgroundColor: '#fff',
                pointHoverBorderColor: '#32b9cd'
            }]
        };

        let totalUsuarios = 0;
        for (let i = 0; i < resposta.length; i++) {
            totalUsuarios += Number(resposta[i].total);
        }

        for (let i = 0; i < resposta.length; i++) {
            let registro = resposta[i];
            labels.push(registro.nome);
            let porcentagem = (registro.total / totalUsuarios) * 100;
            dados.datasets[0].data.push(porcentagem.toFixed(1));
        }

        const config = {
            type: "radar",
            data: dados,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: 10 },
                scales: {
                    r: {
                        min: 0,
                        suggestedMax: 50,
                        grid:       { color: '#D1D5DB' },
                        angleLines: { color: '#D1D5DB' },
                        ticks: {
                            stepSize: 20,
                            callback: function(value) { return value + '%'; },
                            font: { family: "'Exo 2', sans-serif", size: 10 },
                            backdropColor: 'transparent',
                            color: '#6B7280'
                        },
                        pointLabels: {
                            font: { family: "'Exo 2', sans-serif", size: 13, weight: '600' },
                            color: '#1a1a1a',
                            padding: 15
                        }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.raw + '% dos usuários';
                            }
                        }
                    }
                }
            }
        };

        new Chart(document.getElementById("myChartCanvas"), config);
    }

    function carregarGrafico() {
        document.getElementById("graficos").innerHTML = `
            <div id="graficoPerfis" style="width:100%; max-width:900px; display:flex; flex-direction:column; align-items:center;">
                <h3 style="color:#1a1a1a; margin-bottom:20px; font-family:'Exo 2',sans-serif; font-size:18px; font-weight:600;">
                    Distribuição dos Perfis Filosóficos
                </h3>
                <div class="grafico-container">
                    <canvas id="myChartCanvas"></canvas>
                </div>
            </div>
        `;
        obterDadosGrafico();
    }

</script>

</html>
