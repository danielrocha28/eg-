                <!-- O Jogo -->

            <div class="cards" id="cardAquarios"></div>

</body>
<script>

    ],
    4: [
        "Companheiros de viagem que compartilham a mesma estranheza e o mesmo tédio de existir.",
        "Aqueles que testam minha autenticidade e me lembram que sou livre para me definir.",
        "Indivíduos únicos que também enfrentam o dilema solitário da própria alma perante o absoluto.",
        "Distrações passageiras ou estruturas sociais vazias que tentam ditar regras irrelevantes.",
        "O espelho da minha própria humanidade; existo para e com os outros em busca de um mundo melhor.",
        "Seres com quem divido o espaço e o tempo, percebidos através da minha vivência e empatia imediata."
    ],
    5: [
        "Aceitar o absurdo da vida e viver intensamente, esgotando todas as possibilidades com rebeldia.",
        "Inventar nosso próprio sentido com total autonomia, assumindo a autoria de nossa história.",
        "Buscar um significado transcendental e subjetivo que vá além da lógica fria do mundo.",
        "Aceitar o vazio absoluto e parar de tentar criar propósitos artificiais para nos enganar.",
        "Dedicar nossa existência a construir um sentido coletivo baseado na dignidade e no bem comum.",
        "Focar em descrever e vivenciar o mundo exatamente como ele se apresenta à nossa percepção."
    ],
    6: [
        "A minha persistência em continuar vivendo e criando mesmo sabendo do caos do mundo.",
        "A soma das minhas escolhas e atos práticos. Eu sou o que eu faço.",
        "A minha relação íntima e sincera com minhas crenças mais profundas e minhas crises internas.",
        "Nada. A identidade é apenas uma ilusão linguística e social; não somos nada fixo.",

    ],
    7: [
        "Encaro como parte do jogo, enfrentando-o sem choramingar ou criar falsas esperanças.",
        "Assumo o sofrimento como consequência direta das minhas escolhas ou da própria condição livre.",

    8: [

        "A angústia é a vertigem da liberdade, que surge quando o espírito quer pôr a síntese e olha para baixo.",
        "Eu vos digo: é preciso ter um caos dentro de si para dar à luz uma estrela cadente.",
        "O homem nada mais é do que aquilo que ele faz de si mesmo. Esse é o primeiro princípio do existencialismo.",

    async function iniciarQuiz() {

        try {

            const resposta = await fetch("/quiz/perguntas");

            if (!resposta.ok) {
                throw new Error("Erro ao buscar perguntas");
            }

            listaDeQuestoes = await resposta.json();

            quantidadeDeQuestoes = listaDeQuestoes.length;

            if (quantidadeDeQuestoes <= 0) {

                alert("Nenhuma pergunta cadastrada.");

                return;
            }

            document.getElementById("jogo").style.display = "flex";

           document.getElementById("telaInicial").style.display = "none";

            document.getElementById("qtdQuestoes").innerHTML = quantidadeDeQuestoes;

            preencherHTMLcomQuestaoAtual(0);

            btnSubmeter.disabled = false;


        } catch (erro) {

            console.error("Erro ao iniciar quiz:", erro);

            alert("Erro ao carregar quiz");
        }
    }

    function preencherHTMLcomQuestaoAtual(index) {

        habilitarAlternativas(true);

        const q = listaDeQuestoes[index];

        numeroDaQuestaoAtual = index;

        document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = index + 1;

        // ===== ENUNCIADO VINDO DO BANCO =====
        document.getElementById("spanQuestaoExibida").innerHTML = q.enunciado;

        // ===== ALTERNATIVAS FIXAS POR ID =====
        const alts = alternativasPorQuestao[q.id];

        document.getElementById("labelOpcaoUm").innerHTML    = alts[0];
        document.getElementById("labelOpcaoDois").innerHTML  = alts[1];
        document.getElementById("labelOpcaoTres").innerHTML  = alts[2];
        document.getElementById("labelOpcaoQuatro").innerHTML = alts[3];
        document.getElementById("labelOpcaoCinco").innerHTML = alts[4];
        document.getElementById("labelOpcaoSeis").innerHTML  = alts[5];
    }

    async function submeter() {

    const options = document.getElementsByName("option");
    const hasChecked = [...options].some(o => o.checked);

    if (!hasChecked) {
        alert("Escolha uma alternativa.");
        return;
    }

    btnSubmeter.disabled = true;
    habilitarAlternativas(false);

    const alternativaSelecionada = [...options].find(o => o.checked).value.slice(-1);
    const perguntaAtual = listaDeQuestoes[numeroDaQuestaoAtual];
    const idUsuario = sessionStorage.ID_USUARIO;

    try {

        const resposta = await fetch("/quiz/resposta", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                alternativaEscolhida: alternativaSelecionada,
                fkUsuario: idUsuario,
                fkPergunta: perguntaAtual.id
            })
        });

        if (!resposta.ok) {
            const erro = await resposta.json();
            throw new Error(erro.mensagem);
        }

        console.log("Resposta cadastrada");

    } catch (erro) {

        console.error("Erro ao cadastrar resposta:", erro);
        // não bloqueia o avanço
    }

    // SEMPRE avança, independente de erro no save
    setTimeout(() => avancar(), 300);
}

    function habilitarAlternativas(enable) {

        [
            'primeiraOpcao',
            'segundaOpcao',
            'terceiraOpcao',
            'quartaOpcao',
            'quintaOpcao',
            'sextaOpcao'

        ].forEach(id => {

            document.getElementById(id).disabled = !enable;
        });
    }

  function avancar() {

    numeroDaQuestaoAtual++;

    desmarcarRadioButtons();

    if (numeroDaQuestaoAtual < quantidadeDeQuestoes) {

        preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual);
        btnSubmeter.disabled = false;

    } else {

        finalizarJogo();
    }
}

    function desmarcarRadioButtons() {

        document.getElementsByName("option")
            .forEach(o => o.checked = false);
    }

 async function finalizarJogo() {

    document.getElementById("opcoes").style.display = "none";

    document.getElementById("perguntaDaQuestaoAtual").style.display = "none";

    document.getElementById("infoQuestao").style.display = "none";

    btnSubmeter.style.display = "none";

    const divMsg = document.getElementById("msgFinal");

    const idUsuario = sessionStorage.ID_USUARIO;

    try {

        // GERA O RESULTADO
        const respostaGerar = await fetch(`/quiz/resultado/${idUsuario}`, {
            method: "POST"
        });

        if (!respostaGerar.ok) {
            throw new Error("Erro ao gerar resultado");
        }

        // BUSCA O RESULTADO
        const respostaBuscar = await fetch(`/quiz/resultado/${idUsuario}`);

        if (!respostaBuscar.ok) {
            throw new Error("Erro ao buscar resultado");
        }

        const resultado = await respostaBuscar.json();

        divMsg.innerHTML = `
            <h2>${resultado[0].nome}</h2>
            <p>${resultado[0].descricao}</p>
        `;

    } catch (erro) {

        console.error(erro);

        divMsg.innerHTML = `
            <h2>Erro ao gerar resultado</h2>
        `;
    }

    divMsg.style.display = "block";

    btnTentarNovamente.style.display = "block";

    btnTentarNovamente.disabled = false;
}

    function tentarNovamente() {

        window.location.reload();
    }

</script>
