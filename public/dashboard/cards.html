<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egó | Quizzes</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />

    <script src="../js/sessao.js"></script>
    <script src="../js/alerta.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body onload="validarSessao(), atualizacaoPeriodica(), onloadEsconder()">

    <div class="janela">

        <div class="header-left dash-header">
            <h1><a href="../index.html" class="card-logo"><img src="../assets/imgs/logo-branca.png" alt=""></a></h1>
            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>
            <div class="btn-nav">
                <h3>Quizzes</h3>
            </div>
            <div class="btn-nav-white">
                <a href="./dashboard.html">
                    <h3>Gráficos</h3>
                </a>
            </div>
            <div class="btn-nav-white">
                <a href="./mural.html">
                    <h3>Mural de Avisos</h3>
                </a>
            </div>
            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>
        </div>

        <div class="dash">

            <div id="pontuacaoEJogo" class="quiz">
                <button id="btnIniciarQuiz" onclick="iniciarQuiz()">INICIAR QUIZ</button>

                <!-- O Jogo -->
                <div id="jogo" style="display: none;">
                    <div id="infoQuestao">
                        <span>Questão <span id="spanNumeroDaQuestaoAtual"></span> de <span id="qtdQuestoes"></span></span>
                    </div>

                    <div id="perguntaDaQuestaoAtual">
                        <span id="spanQuestaoExibida"></span>
                    </div>

                    <div id="opcoes">
                        <span>
                            <input type="radio" id="primeiraOpcao" name="option" value="alternativaA" />
                            <label for="primeiraOpcao" id="labelOpcaoUm"></label>
                        </span>
                        <span>
                            <input type="radio" id="segundaOpcao" name="option" value="alternativaB" />
                            <label for="segundaOpcao" id="labelOpcaoDois"></label>
                        </span>
                        <span>
                            <input type="radio" id="terceiraOpcao" name="option" value="alternativaC" />
                            <label for="terceiraOpcao" id="labelOpcaoTres"></label>
                        </span>
                        <span>
                            <input type="radio" id="quartaOpcao" name="option" value="alternativaD" />
                            <label for="quartaOpcao" id="labelOpcaoQuatro"></label>
                        </span>
                    </div>

                    <div id="botoes">
                        <button onclick="submeter()" id="btnSubmeter">Submeter resposta</button>
                        <button onclick="avancar()" id="btnProx" disabled>Próxima questão</button>

                        <!-- Mensagem Final aparecerá aqui dentro quando o jogo acabar -->
                        <div id="msgFinal" style="display: none; margin-top: 20px; padding: 15px; border-radius: 12px; text-align: center;"></div>

                        <button onclick="tentarNovamente()" id="btnTentarNovamente" disabled style="display: none;">Reiniciar Quiz</button>
                    </div>
                </div>
            </div>

            <div class="cards" id="cardAquarios"></div>

        </div>
    </div>

</body>
<script>

    let listaDeQuestoes = [];
    let numeroDaQuestaoAtual = 0;
    let quantidadeDeQuestoes = 0;

    async function iniciarQuiz() {

        try {

            const resposta = await fetch("/quiz/perguntas");

            if (!resposta.ok) {
                throw new Error("Erro ao buscar perguntas");
            }

            listaDeQuestoes = await resposta.json();

            quantidadeDeQuestoes = listaDeQuestoes.length;

            if (quantidadeDeQuestoes <= 0) {

                alert("Nenhuma pergunta cadastrada.");

                return;
            }

            document.getElementById("jogo").style.display = "flex";

            document.getElementById("btnIniciarQuiz").style.display = "none";

            document.getElementById("qtdQuestoes").innerHTML = quantidadeDeQuestoes;

            preencherHTMLcomQuestaoAtual(0);

            btnSubmeter.disabled = false;

            btnProx.disabled = true;

        } catch (erro) {

            console.error("Erro ao iniciar quiz:", erro);

            alert("Erro ao carregar quiz");
        }
    }

    function preencherHTMLcomQuestaoAtual(index) {

        habilitarAlternativas(true);

        const q = listaDeQuestoes[index];

        numeroDaQuestaoAtual = index;

        document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = index + 1;

        // ===== ENUNCIADO VINDO DO BANCO =====
        document.getElementById("spanQuestaoExibida").innerHTML = q.enunciado;

        // ===== ALTERNATIVAS FIXAS =====
        document.getElementById("labelOpcaoUm").innerHTML = "Alternativa A";

        document.getElementById("labelOpcaoDois").innerHTML = "Alternativa B";

        document.getElementById("labelOpcaoTres").innerHTML = "Alternativa C";

        document.getElementById("labelOpcaoQuatro").innerHTML = "Alternativa D";
    }

    async function submeter() {

        const options = document.getElementsByName("option");

        const hasChecked = [...options].some(o => o.checked);

        if (!hasChecked) {

            alert("Escolha uma alternativa.");

            return;
        }

        btnSubmeter.disabled = true;

        habilitarAlternativas(false);

        const alternativaSelecionada =
           [...options].find(o => o.checked).value.slice(-1);

        const perguntaAtual =
            listaDeQuestoes[numeroDaQuestaoAtual];

        const idUsuario = sessionStorage.ID_USUARIO;

        try {

            const resposta = await fetch("/quiz/resposta", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    alternativaEscolhida: alternativaSelecionada,

                    fkUsuario: idUsuario,

                    fkPergunta: perguntaAtual.id
                })
            });

            if (!resposta.ok) {

                const erro = await resposta.json();

                throw new Error(erro.mensagem);
            }

            console.log("Resposta cadastrada");

        } catch (erro) {

            console.error("Erro ao cadastrar resposta:", erro);

            alert("Erro ao salvar resposta");
        }

        btnProx.disabled = false;
    }

    function habilitarAlternativas(enable) {

        [
            'primeiraOpcao',
            'segundaOpcao',
            'terceiraOpcao',
            'quartaOpcao'
        ].forEach(id => {

            document.getElementById(id).disabled = !enable;
        });
    }

    function avancar() {

        numeroDaQuestaoAtual++;

        btnProx.disabled = true;

        btnSubmeter.disabled = false;

        desmarcarRadioButtons();

        if (numeroDaQuestaoAtual < quantidadeDeQuestoes) {

            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual);

        } else {

            finalizarJogo();
        }
    }

    function desmarcarRadioButtons() {

        document.getElementsByName("option")
            .forEach(o => o.checked = false);
    }

    function finalizarJogo() {

        document.getElementById("opcoes").style.display = "none";

        document.getElementById("perguntaDaQuestaoAtual").style.display = "none";

        document.getElementById("infoQuestao").style.display = "none";

        btnSubmeter.style.display = "none";

        btnProx.style.display = "none";

        const divMsg = document.getElementById("msgFinal");

        divMsg.innerHTML = "Quiz finalizado com sucesso.";

        divMsg.style.display = "block";

        btnTentarNovamente.style.display = "block";

        btnTentarNovamente.disabled = false;
    }

    function tentarNovamente() {

        window.location.reload();
    }

</script>

</html>
